name: Build OpenCode2API Android APK
on:
  push:
    branches:
      - build-opencode2api-android
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout packaging branch
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.2'

      - name: Check preinstalled Android SDK
        run: |
          ls "$ANDROID_HOME/platforms"
          ls "$ANDROID_HOME/build-tools"
          ls "$ANDROID_HOME/ndk"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Cross-compile Go backend and write Android application
        run: bash build-android.sh

      - name: Build installable APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify APK contains ARM64 native backend
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep "lib/arm64-v8a/libopencode2api.so"
          sha256sum app/build/outputs/apk/debug/app-debug.apk | tee APK.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OpenCode2API-Android-ARM64-APK
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            APK.sha256
            upstream-commit.txt
          if-no-files-found: error
